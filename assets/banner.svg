<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Urai — AI Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF9F7"/>
      <stop offset=".55" stop-color="#F4F6FF"/>
      <stop offset="1" stop-color="#F7F3FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#6C63FF"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0A84FF" flood-opacity=".18"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2b2b3a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="1080" cy="60" r="180" fill="#0A84FF" opacity=".05"/>
  <circle cx="120" cy="400" r="220" fill="#6C63FF" opacity=".05"/>

  <!-- mark -->
  <g filter="url(#soft)">
    <rect x="72" y="112" width="112" height="112" rx="26" fill="url(#accent)"/>
    <path d="M128 136 133.5 162.5 160 168 133.5 173.5 128 200 122.5 173.5 96 168 122.5 162.5Z" fill="#fff"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="176" font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif"
        font-size="52" font-weight="750" fill="#141419" letter-spacing="-1.5">Urai</text>
  <text x="212" y="212" font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif"
        font-size="20" font-weight="500" fill="#6b6b76">AI Studio that runs on your hardware</text>

  <!-- pills -->
  <g font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="600">
    <g filter="url(#cardShadow)">
      <rect x="212" y="240" width="132" height="42" rx="21" fill="#fff"/>
      <text x="236" y="266" fill="#141419">Local LLM</text>
      <rect x="356" y="240" width="126" height="42" rx="21" fill="#fff"/>
      <text x="380" y="266" fill="#141419">Agents</text>
      <rect x="494" y="240" width="112" height="42" rx="21" fill="#fff"/>
      <text x="518" y="266" fill="#141419">Wiki</text>
      <rect x="618" y="240" width="120" height="42" rx="21" fill="#fff"/>
      <text x="642" y="266" fill="#141419">Voice</text>
      <rect x="750" y="240" width="146" height="42" rx="21" fill="#fff"/>
      <text x="774" y="266" fill="#141419">Vibe Code</text>
      <rect x="212" y="296" width="152" height="42" rx="21" fill="#fff"/>
      <text x="236" y="322" fill="#141419">PWA + Desktop</text>
    </g>
  </g>

  <!-- right card -->
  <g filter="url(#cardShadow)">
    <rect x="880" y="132" width="248" height="176" rx="28" fill="#fff" opacity=".92"/>
    <circle cx="916" cy="168" r="7" fill="#34C759"/>
    <text x="934" y="174" font-family="Inter, -apple-system, Segoe UI, system-ui, sans-serif"
          font-size="14" font-weight="600" fill="#141419">urai api · :8777</text>
    <rect x="908" y="196" width="192" height="10" rx="5" fill="#EDEBE7"/>
    <rect x="908" y="196" width="140" height="10" rx="5" fill="url(#accent)"/>
    <rect x="908" y="222" width="150" height="10" rx="5" fill="#EDEBE7"/>
    <rect x="908" y="248" width="176" height="10" rx="5" fill="#EDEBE7"/>
    <text x="908" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#6b6b76">GET /health → 200</text>
  </g>
</svg>
