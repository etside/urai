<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urai — local AI playground</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;500&display=swap');
:root{
  --bg:#0a0d14; --bg-subtle:#111827; --card:#171e2a;
  --line:#2a3550; --muted:#8892b0; --txt:#f8f8f2; --dim:#575f82;
  --acc:#00d4aa; --accent:#00b8d4; --ok:#3ddc84; --err:#ff6b6b;
  --radius:10px; --spacing:8px; --gutter:16px;
  --font:400 13px/1.6 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
}
* {box-sizing:border-box; margin:0; padding:0;}
body{
  font:var(--font);
  background:var(--bg); color:var(--txt);
}
#root{max-width:920px;margin:0 auto;padding:var(--gutter);min-height:100vh;}
/* Header */
header{display:flex;align-items:center;gap:var(--spacing);padding:var(--spacing);background:var(--bg-subtle);border-radius:var(--radius);margin-bottom:var(--gutter);border:1px solid var(--line);}
.logo{font-weight:600;color:var(--txt);font-size:18px;}
.status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status-dot.ok{background:var(--ok)}.status-dot.bad{background:var(--err)}.status-dot.dim{background:var(--muted);}
.header-text{margin-left:auto;}
.header-text .ver{font-size:10px;color:var(--muted);letter-spacing:.2px;}
/* Tabs */
.tabs{display:flex;gap:var(--spacing);margin:var(--gutter) 0;}
.tab-btn{background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:var(--radius);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s;}
.tab-btn:hover{background:var(--bg-subtle);color:var(--txt)}
.tab-btn.on{background:var(--acc);color:#051b25;border-color:var(--acc);}
.tab-btn.on:hover{background:var(--accent);color:#04122b;}
/* Chat section */
.chat-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--gutter);}
#msgs{flex:1;overflow-y:auto;padding:var(--gutter) 0;display:flex;flex-direction:column;gap:var(--spacing);}
.msg{display:flex;gap:var(--spacing);max-width:85%;font-size:13px;line-height:1.5;}
.msg.user{align-self:flex-end;}
.msg.assistant{align-self:flex-start;}
.avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--bg);}
.msg.user .avatar{background:var(--acc);color:#051b25;}
.msg.assistant .avatar{background:var(--card);color:var(--muted);content:'U';}
.bubble{padding:var(--spacing) var(--spacing) var(--spacing) calc(var(--spacing)+36px);border-radius:var(--radius);position:relative;word-break:break-all;font-size:13px;line-height:1.5;}
.bubble.user{background:var(--acc);color:#051b25;margin-left:36px;}
.bubble.assistant{background:var(--bg-subtle);color:var(--txt);margin-right:36px;}
.bubble .meta{font-size:10px;color:var(--muted);margin-top:2px;display:block;}
.typing{color:var(--muted);font-style:italic;padding:var(--spacing);font-size:13px; }
/* Input row */
.input-row{display:flex;gap:var(--spacing);padding:var(--gutter);background:var(--bg-subtle);border-radius:var(--radius);border-top:1px solid var(--line);align-items:center;}
.input-row input{flex:1;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:13px; transition:border-color .15s,box-shadow .15s;}
.input-row input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(0,212,170,0.12);}
.input-row button{background:var(--acc);color:#051b25;border:0;border-radius:var(--radius);padding:0 16px;font-weight:600;font-size:12px;cursor:pointer;transition:background .15s,transform .08s;}
.input-row button:disabled{opacity:.5;}
.input-row button:hover:not(:disabled){background:var(--accent);color:#04122b;transform:translateY(-1px);}
.input-row button:active:not(:disabled){transform:translateY(1px);}
/* Sections */
.section{display:none;padding:var(--gutter);}
.section.on{display:block;}
/* See section */
#prev-img{max-width:100%;border-radius:var(--radius);border:1px solid var(--line);margin-top:var(--spacing);display:none;}
/* Imagine section */
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--spacing);margin:var(--gutter) 0;}
.grid label{font-size:11px;color:var(--muted);}
.grid input,.grid select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:12px;width:100%;}
.grid select{cursor:pointer;}
</style>
</head>
<body>
<div id="root">
<header>
  <div class="logo">Urai</div>
  <span class="status-dot ok" id="dot"></span>
  <div class="header-text"><span class="ver" id="ver">v1-lite</span></div>
  <div style="margin-left:auto;display:flex;gap:6px;align-items:center;">
    <input id="ep" size="25" style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:12px;" placeholder="Endpoint" value="http://127.0.0.1:8080">
    <input id="key" size="14" type="password" style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:12px;" placeholder="API key">
    <select id="model" style="background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:12px;"></select>
  </div>
</header>

<div id="root">
  <!-- Chat -->
  <section id="chat" class="section on chat-section">
    <div id="msgs"></div>
    <div class="input-row">
      <input id="qin" type="text" placeholder="Ask Urai… (Enter to send)">
      <button class="go" id="qgo">Send</button>
    </div>
  </section>

  <!-- See -->
  <section id="see" class="section chat-section">
    <div>
      <input type="file" id="img" accept="image/*">
      <img id="prev-img" src="#" alt="preview" style="display:none;">
    </div>
    <div class="row" style="margin:var(--gutter) 0 0;"><input id="squestion" type="text" value="Describe this image in detail."><button class="go" id="sgo">Ask</button></div>
    <div id="sout"></div>
  </section>

  <!-- Imagine -->
  <section id="imagine" class="section chat-section">
    <div class="row" style="margin:var(--gutter) 0 0;"><input id="prompt" type="text" placeholder="A robot reading a book, watercolor…"><button class="go" id="igo">Generate</button></div>
    <div class="grid">
      <label>Steps<input id="steps" type="number" value="2" min="1" max="20"></label>
      <label>Seed<input id="seed" type="number" value="7"></label>
      <label>Size<select id="size"><option>512x512</option><option>768x512</option><option>512x768</option></select></label>
    </div>
    <div id="iout"></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const API=()=>$('ep').value.replace(/\/$/,'');

const hdrs=()=>{const h={'Content-Type':'application/json'};if($('key').value)h['Authorization']='Bearer '+$('key').value;return h};

let imgB64='';

// status boot
boot();

async function boot(){
  try{
    const h=await(await fetch(API()+'/health')).json();
    $('dot').className=h.status==='ok'?'ok':'bad';
    const m=await(await fetch(API()+'/v1/models',{headers:hdrs()})).json();
    const modelSelect=$('model');
    if(modelSelect){modelSelect.innerHTML=(m.data||[]).map(x=>`<option>${x.id}</option>`).join('')}
  }catch(e){$('dot').className='bad'}
}

// ----- chat -----
const msgs=$('msgs');
function bubble(who,text){
  const d=document.createElement('div');
  d.className='msg '+who;
  const av=document.createElement('div');
  av.className='avatar';
  av.textContent=who==='u'?'U':'A';
  d.appendChild(av);
  const bubble=document.createElement('div');
  bubble.className='bubble '+who;
  bubble.textContent=text;
  d.appendChild(bubble);
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
  return d;
}

async function send(stream){
  const q=$('qin').value.trim();if(!q)return;
  bubble('u',q);
  const bubble=$('msgs').lastElementChild;
  bubble.classList.add('typing');
  bubble.lastElementChild.textContent='…';
  $('qgo').disabled=true;
  try{
    const r=await fetch(API()+'/v1/chat/completions',{method:'POST',headers:hdrs(),
      body:JSON.stringify({model:$('model').value,stream,messages:[{role:'user',content:q}]})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    if(stream){
      const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
      while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
        for(const line of buf.split('\n')){const t=line.trim();if(!t.startsWith('data:'))continue;
          const p=t.slice(5).trim();if(p==='[DONE]')continue;
          try{out+=JSON.parse(p).choices[0].delta.content||'';bubble.lastElementChild.textContent=out}catch(e){}}
        buf=buf.slice(-500)}
      bubble.lastElementChild.textContent=out||'(empty)'
    }else{
      const j=await r.json();
      bubble.lastElementChild.textContent=j.choices?j.choices[0].message.content:JSON.stringify(j);
    }
    const tb=$('msgs').querySelector('.typing');
    if(tb){tb.remove()}
  }catch(e){
    const tb=$('msgs').querySelector('.typing');
    if(tb){tb.remove(); bubble('a','Error: '+e.message)}
  }
  $('qgo').disabled=false;
}
$('qgo').onclick=()=>send(true);
$('qin').onkeydown=e=>{if(e.key==='Enter')send(true)};

// ----- see -----
$('img').onchange=()=>{const f=$('img').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const prev=$('prev-img');prev.src=r.result;prev.style.display='block'}};

$('sgo').onclick=async()=>{
  if(!imgB64){$('sout').textContent='Pick an image first.';return}
  $('sout').textContent='…';
  try{
    const r=await fetch(API()+'/v1/chat/completions',{method:'POST',headers:hdrs(),body:JSON.stringify({
      model:$('model').value,messages:[{role:'user',content:[
        {type:'image_url',image_url:{url:imgB64}},{type:'text',text:$('squestion').value}]}]})});
    const j=await r.json();
    $('sout').textContent=j.choices?j.choices[0].message.content:JSON.stringify(j);
  }catch(e){$('sout').textContent='Error: '+e.message}};

// ----- imagine -----
$('igo').onclick=async()=>{
  const p=$('prompt').value.trim();if(!p)return;$('iout').textContent='rendering…';
  const[W,H]=$('size').value.split('x').map(Number);
  try{
    const r=await fetch(API()+'/v1/images/generations',{method:'POST',headers:hdrs(),body:JSON.stringify({
      prompt:p,steps:+$('steps').value,seed:+$('seed').value,width:W,height:H,response_format:'b64_json'})});
    const j=await r.json();
    if(j.data&&j.data[0].b64_json){
      $('iout').innerHTML=`<img class="prev" src="data:image/png;base64,${j.data[0].b64_json}"><div class="dim">${(j.elapsed_s||'?')}s · seed ${$('seed').value}</div>`
    }else{$('iout').textContent=JSON.stringify(j).slice(0,500)}
  }catch(e){$('iout').textContent='Error: '+e.message}
}

// ----- tab switch -----
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('t-'+b.dataset.t).classList.add('on')
})
</script>
</body>
</html>
