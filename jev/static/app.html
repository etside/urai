<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urai — local AI playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap');
:root{
  --bg:#0b0f1a;--bg-soft:#111827;--card:#151d2e;--card-2:#1a2338;
  --line:#232e47;--line-soft:#1c2540;
  --txt:#e8eef7;--muted:#8b98b8;--dim:#5c6885;
  --acc:#3b82f6;--acc-soft:#2563eb;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;
  --grad:linear-gradient(135deg,#3b82f6,#8b5cf6);
  --r-lg:16px;--r-md:12px;--r-sm:8px;
  --sh:0 4px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1060px;margin:0 auto;padding:0 16px}

/* ---------- Header ---------- */
header{display:flex;align-items:center;gap:12px;padding:14px 0;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.01em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;box-shadow:0 2px 12px rgba(59,130,246,.35)}
.ver{font-size:11px;color:var(--dim);background:var(--card);padding:2px 8px;border-radius:20px;border:1px solid var(--line)}
.hspace{flex:1}
.hdr-controls{display:flex;align-items:center;gap:8px}
.hdr-controls input,.hdr-controls select{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-size:12.5px;transition:border-color .15s}
.hdr-controls input:focus,.hdr-controls select:focus{outline:none;border-color:var(--acc)}
.hdr-controls input{width:170px}
.hdr-controls select{max-width:150px;cursor:pointer}
.new-chat-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--muted);transition:all .15s}
.new-chat-btn:hover{color:var(--txt);border-color:var(--acc)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:14px;width:fit-content;margin-bottom:14px;flex-shrink:0}
.tab-btn{padding:7px 18px;border-radius:11px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s}
.tab-btn:hover{color:var(--txt)}
.tab-btn.on{background:var(--card-2);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* ---------- Chat layout ---------- */
.chat-wrap{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--bg-soft);border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}

#msgs{flex:1;overflow-y:auto;padding:24px 24px 8px;display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth}

/* Empty state */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 20px;text-align:center}
.empty-mark{width:64px;height:64px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 30px rgba(59,130,246,.3)}
.empty-state h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.empty-state p{color:var(--muted);font-size:13.5px;max-width:420px;line-height:1.6}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:560px}
.sug-btn{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:12.5px;color:var(--muted);transition:all .15s}
.sug-btn:hover{color:var(--txt);border-color:var(--acc);background:var(--card-2)}

/* Messages */
.msg{display:flex;gap:12px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.msg.user .msg-body{align-items:flex-end}
.msg.assistant .msg-body{align-items:flex-start}
.msg-role{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;padding:0 4px}
.bubble{padding:12px 16px;border-radius:var(--r-md);font-size:14px;line-height:1.65;word-break:break-word;max-width:720px}
.msg.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:4px}
.msg.assistant .bubble{background:var(--card);border:1px solid var(--line-soft);border-bottom-left-radius:4px}
.bubble pre{background:rgba(0,0,0,.3);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:12px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:12.5px;margin:10px 0}
.bubble code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:rgba(0,0,0,.25);padding:2px 6px;border-radius:4px}
.bubble p{margin:6px 0}.bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
.bubble ul,.bubble ol{padding-left:22px;margin:8px 0}
.bubble li{margin:3px 0}
.bubble a{color:var(--acc);text-decoration:none}.bubble a:hover{text-decoration:underline}

.msg-actions{display:flex;gap:4px;opacity:0;transition:opacity .15s;padding:0 4px}
.msg:hover .msg-actions{opacity:1}
.act-btn{font-size:11px;color:var(--dim);padding:3px 8px;border-radius:5px;transition:all .12s;display:flex;align-items:center;gap:4px}
.act-btn:hover{color:var(--txt);background:var(--card)}
.act-btn.copied{color:var(--ok)}

/* Thinking / typing */
.think-dots{display:inline-flex;gap:5px;padding:2px 0}
.think-dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.think-dots i:nth-child(2){animation-delay:.2s}.think-dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.stop-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--err);padding:5px 12px;border-radius:var(--r-sm);border:1px solid var(--err);background:rgba(239,68,68,.08);transition:background .15s;margin-left:8px}
.stop-btn:hover{background:rgba(239,68,68,.15)}

/* ---------- Input ---------- */
.input-area{padding:14px 16px 16px;flex-shrink:0}
.input-hints{font-size:11px;color:var(--dim);padding:6px 4px 0;display:flex;gap:14px}
.input-hints kbd{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10px;font-family:inherit}
.input-row{display:flex;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 10px 10px 16px;transition:border-color .15s,box-shadow .15s}
.input-row:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
textarea{flex:1;background:none;border:none;outline:none;resize:none;font-size:14px;line-height:1.5;max-height:160px;padding:6px 0;color:var(--txt)}
textarea::placeholder{color:var(--dim)}
.send-btn{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s,transform .1s}
.send-btn:hover{opacity:.9}
.send-btn:active{transform:scale(.94)}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.send-btn svg{width:17px;height:17px}

/* ---------- See / Imagine panels ---------- */
.panel{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:16px}
.panel h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel .hint{font-size:12.5px;color:var(--dim);line-height:1.6}
.drop-zone{border:2px dashed var(--line);border-radius:var(--r-lg);padding:36px 20px;text-align:center;transition:all .15s;cursor:pointer}
.drop-zone:hover,.drop-zone.drag{border-color:var(--acc);background:rgba(59,130,246,.05)}
.drop-zone .dz-icon{font-size:32px;margin-bottom:8px}
.drop-zone p{color:var(--muted);font-size:13px}
.see-preview{max-width:100%;max-height:340px;border-radius:var(--r-md);border:1px solid var(--line);display:none}
.answer-box{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:16px;font-size:14px;line-height:1.65;display:none;white-space:pre-wrap;word-break:break-word}

.gen-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gen-controls label{font-size:11.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.gen-controls input,.gen-controls select{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:13px;width:100%}
.gen-controls input:focus,.gen-controls select:focus{outline:none;border-color:var(--acc)}
.gen-btn{background:var(--grad);color:#fff;border-radius:var(--r-md);padding:11px 20px;font-size:13.5px;font-weight:600;align-self:flex-start;transition:opacity .15s;display:flex;align-items:center;gap:8px}
.gen-btn:hover{opacity:.9}.gen-btn:disabled{opacity:.4;cursor:not-allowed}
.gen-result{display:none;flex-direction:column;gap:10px}
.gen-result img{max-width:100%;border-radius:var(--r-md);border:1px solid var(--line)}
.gen-meta{font-size:11.5px;color:var(--dim)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error / notice */
.notice{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:10px 14px;border-radius:var(--r-sm);margin-bottom:10px}
.notice.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.notice.warn{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.3);color:#fcd34d}

/* Footer */
footer{text-align:center;font-size:11px;color:var(--dim);padding:10px 0 14px;flex-shrink:0}

/* ---------- Responsive ---------- */
@media (max-width:640px){
  #app{padding:0 10px}
  header{flex-wrap:wrap;gap:8px}
  .hdr-controls{width:100%;flex-wrap:wrap}
  .hdr-controls input{flex:1;width:auto}
  .tabs{width:100%;justify-content:center}
  #msgs{padding:16px 14px 4px}
  .bubble{font-size:13.5px;padding:10px 13px}
  .gen-controls{grid-template-columns:1fr}
  .new-chat-btn span{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="logo-mark">◈</span>Urai</div>
    <span class="ver" id="ver">v1-lite</span>
    <div class="hspace"></div>
    <div class="hdr-controls">
      <input id="ep" size="25" title="API endpoint" placeholder="Endpoint">
      <input id="key" size="14" type="password" title="Sent as Bearer token" placeholder="API key (if set)">
      <select id="model" title="Model"></select>
      <button class="new-chat-btn" id="newchat" title="Start a new conversation">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn on" data-t="chat">Chat</button>
    <button class="tab-btn" data-t="see">See</button>
    <button class="tab-btn" data-t="imagine">Imagine</button>
  </div>

  <div class="chat-wrap" id="t-chat">
    <div id="msgs"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="qin" rows="1" placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"></textarea>
        <button class="send-btn" id="qgo" title="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="input-hints">
        <span><kbd>Enter</kbd> send</span><span><kbd>Shift+Enter</kbd> newline</span><span id="modelinfo" style="margin-left:auto"></span>
      </div>
    </div>
  </div>

  <div class="panel" id="t-see" style="display:none">
    <h3>Vision</h3>
    <p class="hint">Upload an image and ask a question. The active vision model analyzes it.</p>
    <label class="drop-zone" id="dz">
      <div class="dz-icon">🖼️</div>
      <p>Click to upload or drag an image here</p>
      <input type="file" id="img" accept="image/*" style="display:none">
    </label>
    <img id="see-prev" class="see-preview" alt="preview">
    <textarea id="squestion" rows="2" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:14px;resize:none">Describe this image in detail.</textarea>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="gen-btn" id="sgo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        Ask
      </button>
    </div>
    <div id="serr"></div>
    <div class="answer-box" id="sout"></div>
  </div>

  <div class="panel" id="t-imagine" style="display:none">
    <h3>Image generation</h3>
    <p class="hint">Describe an image and the SD-Turbo runner will generate it.</p>
    <textarea id="prompt" rows="2" style="background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:14px;resize:none" placeholder="A robot reading a book, watercolor…"></textarea>
    <div class="gen-controls">
      <label>Steps<input id="steps" type="number" value="4" min="1" max="20"></label>
      <label>Seed<input id="seed" type="number" value="7"></label>
      <label>Size<select id="size"><option>512x512</option><option>768x512</option><option>512x768</option></select></label>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <button class="gen-btn" id="igo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
        Generate
      </button>
    </div>
    <div id="ierr"></div>
    <div class="gen-result" id="iout"></div>
  </div>

  <footer>Urai runs 100% local — your data never leaves your machine. <span id="footstat"></span></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const API=()=>$('ep').value.replace(/\/$/,'');
const hdrs=()=>{const h={'Content-Type':'application/json'};if($('key').value)h['Authorization']='Bearer '+$('key').value;return h};

/* ---------- state ---------- */
let history=[];           // multi-turn conversation
let controller=null;      // AbortController for stop
let imgB64='';

/* ---------- persistence ---------- */
localStorage.urai_ep=localStorage.urai_ep||location.origin;
$('ep').value=localStorage.urai_ep;
$('ep').onchange=()=>{localStorage.urai_ep=$('ep').value;boot()};
$('key').value=localStorage.urai_key||'';
$('key').onchange=()=>localStorage.urai_key=$('key').value;

/* ---------- boot ---------- */
async function boot(){
  try{
    const h=await(await fetch(API()+'/health')).json();
    $('footstat').textContent=h.local_llama?'· local runner ready':'· runner not started';
    const m=await(await fetch(API()+'/v1/models',{headers:hdrs()})).json();
    const sel=$('model');const cur=localStorage.urai_model;
    sel.innerHTML=(m.data||[]).map(x=>`<option value="${x.id}">${x.id}</option>`).join('');
    if(cur&&[...sel.options].some(o=>o.value===cur))sel.value=cur;else localStorage.urai_model=sel.value;
    sel.onchange=()=>{localStorage.urai_model=sel.value;$('modelinfo').textContent=sel.value};
    $('modelinfo').textContent=sel.value;
  }catch(e){$('footstat').textContent='· backend unreachable — check endpoint'}
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.chat-wrap,.panel').forEach(x=>x.style.display='none');
  b.classList.add('on');
  $('t-'+b.dataset.t).style.display=b.dataset.t==='chat'?'flex':'flex';
});

/* ---------- messages ---------- */
const msgs=$('msgs');
const SUGGESTIONS=['What can you do?','Explain quantum computing simply','Write a haiku about the ocean','Give me a productivity tip'];

function renderEmpty(){
  msgs.innerHTML=`<div class="empty-state">
    <div class="empty-mark">◈</div>
    <h2>What's on your mind?</h2>
    <p>I'm your local AI — fully offline, fully private. Ask me anything.</p>
    <div class="suggestions">${SUGGESTIONS.map(s=>`<button class="sug-btn" data-s="${s}">${s}</button>`).join('')}</div>
  </div>`;
  msgs.querySelectorAll('.sug-btn').forEach(b=>b.onclick=()=>{$('qin').value=b.dataset.s;send()});
}
renderEmpty();

function addMsg(role,content,actions=true){
  msgs.querySelector('.empty-state')?.remove();
  const d=document.createElement('div');d.className='msg '+role;
  d.innerHTML=`<div class="msg-body">
    <span class="msg-role">${role==='user'?'You':'Urai'}</span>
    <div class="bubble">${role==='user'?esc(content):md(content)}</div>
    ${actions&&role==='assistant'?`<div class="msg-actions">
      <button class="act-btn" data-act="copy">⧉ Copy</button>
      <button class="act-btn" data-act="retry">↻ Retry</button>
    </div>`:''}
  </div>`;
  msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;
  const cb=d.querySelector('[data-act="copy"]');
  if(cb)cb.onclick=()=>{navigator.clipboard.writeText(content).then(()=>{cb.textContent='✓ Copied';cb.classList.add('copied');setTimeout(()=>{cb.textContent='⧉ Copy';cb.classList.remove('copied')},1500)})};
  const rb=d.querySelector('[data-act="retry"]');
  if(rb)rb.onclick=()=>{const lastU=[...msgs.querySelectorAll('.msg.user')].pop();if(lastU){$('qin').value=lastU.querySelector('.bubble').textContent;send()}};
  return d;
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

/* minimal markdown: bold, italic, code, codeblock, links, lists, paragraphs */
function md(s){
  let t=esc(s);
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>`<pre><code>${code.trim()}</code></pre>`);
  t=t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  t=t.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines=t.split('\n');let inList=false,out='';
  for(const ln of lines){
    const li=ln.match(/^\s*[-*]\s+(.*)/);
    if(li){if(!inList){out+='<ul>';inList=true}out+=`<li>${li[1]}</li>`}
    else{if(inList){out+='</ul>';inList=false}out+=ln?`<p>${ln}</p>`:''}
  }
  if(inList)out+='</ul>';
  return out;
}

/* ---------- chat send ---------- */
function setLoading(on){
  $('qgo').disabled=on;
  $('qgo').innerHTML=on?'<span class="spinner"></span>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>';
}

async function send(){
  const q=$('qin').value.trim();if(!q||$('qgo').disabled)return;
  $('qin').value='';autoGrow();
  history.push({role:'user',content:q});
  addMsg('user',q,false);
  const thinking=document.createElement('div');thinking.className='msg assistant';
  thinking.innerHTML=`<div class="msg-body"><span class="msg-role">Urai</span><div class="bubble"><span class="think-dots"><i></i><i></i><i></i></span></div></div>`;
  msgs.appendChild(thinking);msgs.scrollTop=msgs.scrollHeight;
  const bubble=thinking.querySelector('.bubble');
  setLoading(true);
  controller=new AbortController();
  let stopBtn=null;
  try{
    const r=await fetch(API()+'/v1/chat/completions',{method:'POST',headers:hdrs(),signal:controller.signal,
      body:JSON.stringify({model:$('model').value,stream:true,messages:history})});
    if(!r.ok)throw new Error('HTTP '+r.status+' — '+(await r.text()).slice(0,120));
    stopBtn=document.createElement('button');stopBtn.className='stop-btn';stopBtn.textContent='■ Stop';
    stopBtn.onclick=()=>controller.abort();thinking.querySelector('.msg-body').appendChild(stopBtn);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';
    while(true){
      const{done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        const t=line.trim();if(!t.startsWith('data:'))continue;
        const p=t.slice(5).trim();if(p==='[DONE]')continue;
        try{
          const c=JSON.parse(p).choices[0].delta.content||'';
          out+=c;
          bubble.innerHTML=md(out);
          msgs.scrollTop=msgs.scrollHeight;
        }catch(e){}
      }
    }
    history.push({role:'assistant',content:out||'(empty response)'});
    if(!out)bubble.textContent='(empty response)';
  }catch(e){
    if(e.name==='AbortError'){bubble.innerHTML=md(out||'_Stopped._');history.push({role:'assistant',content:out||'(stopped)'})}
    else bubble.innerHTML=`<span style="color:var(--err)">Error: ${esc(e.message)}</span>`;
  }
  thinking.querySelector('.stop-btn')?.remove();
  thinking.querySelector('.msg-actions')?.remove();
  thinking.querySelector('.bubble').insertAdjacentHTML('afterend','<div class="msg-actions"><button class="act-btn" data-act="copy">⧉ Copy</button><button class="act-btn" data-act="retry">↻ Retry</button></div>');
  thinking.querySelector('[data-act="copy"]').onclick=()=>navigator.clipboard.writeText(out||'').then(()=>{const b=thinking.querySelector('[data-act="copy"]');b.textContent='✓ Copied';b.classList.add('copied');setTimeout(()=>{b.textContent='⧉ Copy';b.classList.remove('copied')},1500)});
  thinking.querySelector('[data-act="retry"]').onclick=()=>{const lastU=[...msgs.querySelectorAll('.msg.user')].pop();if(lastU){$('qin').value=lastU.querySelector('.bubble').textContent;send()}};
  setLoading(false);msgs.scrollTop=msgs.scrollHeight;
}

$('qgo').onclick=send;
$('qin').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}
});
function autoGrow(){const t=$('qin');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
$('qin').addEventListener('input',autoGrow);

/* new chat */
$('newchat').onclick=()=>{
  history=[];msgs.innerHTML='';renderEmpty();
};

/* ---------- See (vision) ---------- */
const dz=$('dz');
$('img').onchange=e=>loadImg(e.target.files[0]);
dz.onclick=()=>$('img').click();
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
dz.addEventListener('drop',e=>loadImg(e.dataTransfer.files[0]));
function loadImg(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{imgB64=r.result;$('see-prev').src=imgB64;$('see-prev').style.display='block'};
  r.readAsDataURL(f);
}
$('sgo').onclick=async()=>{
  if(!imgB64){$('sout').style.display='block';$('sout').innerHTML='<span style="color:var(--warn)">⚠ Upload an image first.</span>';return}
  const q=$('squestion').value.trim();if(!q)return;
  const out=$('sout');out.style.display='block';out.innerHTML='<span class="think-dots"><i></i><i></i><i></i></span> Analyzing…';
  try{
    const r=await fetch(API()+'/v1/chat/completions',{method:'POST',headers:hdrs(),body:JSON.stringify({
      model:$('model').value,messages:[{role:'user',content:[
        {type:'image_url',image_url:{url:imgB64}},{type:'text',text:q}]}]})});
    const j=await r.json();
    out.textContent=j.choices?j.choices[0].message.content:JSON.stringify(j).slice(0,400);
  }catch(e){out.innerHTML=`<span style="color:var(--err)">Error: ${esc(e.message)}</span>`}
};

/* ---------- Imagine ---------- */
$('igo').onclick=async()=>{
  const p=$('prompt').value.trim();if(!p)return;
  const[W,H]=$('size').value.split('x').map(Number);
  const btn=$('igo');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Generating…';
  $('ierr').innerHTML='';
  try{
    const r=await fetch(API()+'/v1/images/generations',{method:'POST',headers:hdrs(),body:JSON.stringify({
      prompt:p,steps:+$('steps').value,seed:+$('seed').value,width:W,height:H,response_format:'b64_json'})});
    const j=await r.json();
    if(j.data&&j.data[0].b64_json){
      $('iout').style.display='flex';
      $('iout').innerHTML=`<img src="data:image/png;base64,${j.data[0].b64_json}" alt="generated">
        <div class="gen-meta">${esc(p)} · ${j.elapsed_s||'?'}s · seed ${$('seed').value} · ${W}×${H}</div>`;
    }else{$('iout').style.display='none';$('ierr').innerHTML=`<div class="notice err">${esc(JSON.stringify(j).slice(0,300))}</div>`}
  }catch(e){$('iout').style.display='none';$('ierr').innerHTML=`<div class="notice err">Error: ${esc(e.message)}</div>`}
  btn.disabled=false;btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg> Generate';
};

boot();
</script>
</body>
