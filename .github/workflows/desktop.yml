name: Build desktop apps

# Builds the Urai Studio desktop shell for Linux and Windows.
# Artifacts: AppImage + .deb (Linux), NSIS installer + portable .exe (Windows).
# On a v* tag the installers are attached to the GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage + deb)
            target: linux
          - os: windows-latest
            label: Windows (installer + portable)
            target: win

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build (${{ matrix.target }})
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:${{ matrix.target }}

      - name: List artifacts
        working-directory: desktop
        shell: bash
        run: ls -lh dist || dir dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: urai-desktop-${{ matrix.target }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
          fail_on_unmatched_files: false
