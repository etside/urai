name: Urai GPU Run (auto — Modal default, DO fallback)

# Default GPU path is Modal (T4, ephemeral, no local compute). This workflow
# probes the DO account for self-service GPU sizes and only uses the
# DigitalOcean H100-phase path when such sizes actually exist. Contract-only
# DO accounts (gpu_sizes_via_api == 0) route to Modal automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dataset tag (unified = merge all verified rows)"
        required: false
        default: "unified"
      max_steps:
        description: "Max training steps (300 fits ~1h)"
        required: false
        default: "300"
      backend:
        description: "auto | modal | do"
        required: false
        default: "auto"
      gpu:
        description: "Modal GPU: T4 | A100 | L40S"
        required: false
        default: "T4"
permissions:
  contents: write
jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.pick.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - name: Pick backend (DO probe, Modal default)
        id: pick
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          WANT: ${{ inputs.backend }}
        run: |
          want="$WANT"
          if [ "$want" = "modal" ] || [ "$want" = "do" ]; then
            echo "backend=$want" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n=$(python3 scripts/train/do_gpu_count.py)
          if [ "${n:-0}" -gt 0 ]; then
            echo "DO self-service GPUs: $n -> do"; echo "backend=do" >> "$GITHUB_OUTPUT"
          else
            echo "DO GPUs: 0 (contract-only) -> modal"; echo "backend=modal" >> "$GITHUB_OUTPUT"
          fi

  modal-train:
    needs: route
    if: needs.route.outputs.backend == 'modal'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train unified student on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URAI_TRAIN_TAG: ${{ inputs.tag }}
          MAX_TRAIN_STEPS: ${{ inputs.max_steps }}
          URAI_MODAL_GPU: ${{ inputs.gpu }}
        run: bash scripts/train/modal_train.sh

  do-train:
    needs: route
    if: needs.route.outputs.backend == 'do'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Ephemeral H100 phases (auto-destroy, 1h cap)
        env:
          DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URAI_TRAIN_TAG: ${{ inputs.tag }}
          MAX_TRAIN_STEPS: ${{ inputs.max_steps }}
        run: bash scripts/train/gpu_train.sh create
