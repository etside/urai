name: Urai Train - LoRA Stage 2 (GPU runner required)

# Independence Stage 2: LoRA fine-tune on the verified distill set.
# FAILS FAST without CUDA — it will never fake-train on CPU.
# Needs a GPU runner: set runs-on to your GPU label when commissioned.
# Until then this workflow documents the contract; dispatching on the
# default runner exits at the preflight check by design. Routes:
#  A) free Kaggle T4 notebook (see docs/INDEPENDENCE.md) — recommended;
#  B) --allow-cpu capped demo (slow, demonstration-grade);
#  C) set runs-on to your GPU label for the full run.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dataset tag in data/verified/<tag>.jsonl"
        required: false
        default: "distill-now"
      base:
        description: "Base model id"
        required: false
        default: "Qwen/Qwen3-4B"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GPU preflight (expected to refuse until a GPU runner exists)
        run: |
          python3 scripts/train/lora_urai.py --data data/verified/${{ inputs.tag }}.jsonl --tag ${{ inputs.tag }} --base "${{ inputs.base }}" || \
            echo "::warning::Stage-2 refused (no GPU here). Routes: Kaggle T4 free tier (recommended), --allow-cpu demo, or GPU runner. See docs/INDEPENDENCE.md."
