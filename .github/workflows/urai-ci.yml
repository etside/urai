name: Urai CI (no local build req)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke
        run: |
          python3 -m py_compile jev/*.py
          python3 -c "
import jev.cli, jev.agent, jev.router, jev.backends, jev.server, jev.skills
print('ok')
"
