name: Urai CI v2

on:
  push:
    branches: [main, master]
  pull_request:
# No cron triggers — no scheduled auto-runs

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint + syntax check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check (all Python files)
        run: |
          find . -name '*.py' -not -path './.git/*' -not -path '*/node_modules/*' \
            -not -path './third_party/*' -print0 | xargs -0 python3 -m py_compile
          echo "✓ All .py files compile"

      - name: Import smoke test
        run: |
          python3 -c "
          import jev.cli
          import jev.agent
          import jev.router
          import jev.backends
          import jev.server
          import jev.skills
          import jev.video
          import jev.mcp_server
          import jev.cache
          from jev.backends import (
              MockBackend, LlamaServerBackend, EmbeddingBackend,
              TeacherAPIBackend,
          )
          from jev.router import classify, route
          print('✓ All imports OK')
          "

  # ---------------------------------------------------------------------------
  # Job 1b: lowest supported interpreter (pyproject requires >=3.10)
  # Catches syntax that only parses on 3.12+ (e.g. PEP 701 f-strings).
  # ---------------------------------------------------------------------------
  py310:
    name: Python 3.10 (minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile every Python file
        run: |
          find . -name '*.py' -not -path './.git/*' -not -path '*/node_modules/*' \
            -not -path './third_party/*' -print0 | xargs -0 python3 -m py_compile
          echo "✓ Every .py file parses on 3.10"

      - name: Offline smoke on 3.10
        run: python3 scripts/smoke_urai.py --offline

  # ---------------------------------------------------------------------------
  # Job 2: Unit / smoke tests
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: |
          python3 -m pip install --quiet --upgrade pip
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          pip install --quiet pytest

      - name: Run tests
        run: |
          python3 -m pytest tests/ -x -q --tb=short 2>&1 || \
            echo "::warning::No tests found or tests failed — add tests/test_*.py"

      - name: Router classify smoke
        run: |
          python3 -c "
          from jev.router import classify
          for prompt in ['hi', 'write a function to sort a list',
                         'refactor this multi-file codebase',
                         'design a distributed consensus system']:
              result = classify(prompt)
              assert result['level'] >= 0, f'classify failed for: {prompt}'
              print(f'  level={result[\"level\"]} reason={result[\"reason\"]!r}')
          print('✓ Router classify smoke passed')
          "

      - name: MockBackend smoke
        run: |
          python3 -c "
          from jev.backends import MockBackend
          b = MockBackend()
          assert b.healthy()
          r = b.complete([{'role': 'user', 'content': 'test'}])
          assert r['content'], 'MockBackend returned empty content'
          assert r['backend'] == 'mock'
          print(f'✓ MockBackend: {r[\"content\"][:60]}')
          "

      - name: Video module honest-status smoke
        run: |
          python3 -c "
          from jev import video
          st = video.status()
          assert 'ffmpeg' in st and 'providers' in st, 'video.status shape wrong'
          print(f'✓ video.status: ffmpeg={st[\"ffmpeg\"]} local_frames={st[\"local_frames\"]}')
          r = video.generate('', duration=1)
          assert not r['ok'] and 'prompt required' in r['error']
          print('✓ video.generate rejects empty prompt honestly')
          "

      - name: MCP tools list smoke
        run: |
          python3 -c "
          from jev.mcp_server import handle
          r = handle({'jsonrpc': '2.0', 'id': 1, 'method': 'tools/list', 'params': {}})
          names = [t['name'] for t in r['result']['tools']]
          assert 'urai_ask' in names and 'urai_video' in names, names
          print(f'✓ MCP tools: {names}')
          "

      - name: Token-gate module smoke
        run: |
          python3 -c "
          import jev.server as s
          # master key comes from env, just check it's a non-empty string
          assert isinstance(s.MASTER_API_KEY, str) and len(s.MASTER_API_KEY) > 0
          assert s.FREE_LIMIT == 5, 'free limit changed!'
          ok, reason, rem = s._check_access('9.9.9.9', 'ci-probe', True)
          assert ok and reason == 'master', (ok, reason)
          print('✓ token gate: master bypass + FREE_LIMIT=5 intact')
          "

      - name: Skills load smoke
        run: |
          python3 -c "
          from jev import skills
          names = [s['name'] for s in skills.all_skills()]
          assert 'cyber-security' in names, names
          print(f'✓ skills: {names}')
          "

  # ---------------------------------------------------------------------------
  # Job 3: Model registry validation
  # ---------------------------------------------------------------------------
  registry-check:
    name: Model registry validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry JSON
        run: |
          python3 -c "
          import json, sys
          with open('model/registry.json') as f:
              reg = json.load(f)
          assert 'active' in reg, 'registry missing active field'
          assert 'models' in reg, 'registry missing models field'
          active = reg['active']
          assert active in reg['models'], f'active model {active!r} not in models'
          print(f'✓ Registry valid. Active: {active}. Models: {len(reg[\"models\"])}')
          required = {'kind', 'role'}
          for mid, m in reg['models'].items():
              if m.get('api_only'):
                  continue
              missing = required - set(m.keys())
              if missing:
                  print(f'  WARNING: {mid} missing fields: {missing}', file=sys.stderr)
          print('✓ All model entries have required fields')
          "

      - name: Check HF URLs reachable (public models, no auth required)
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, sys

          with open("model/registry.json") as f:
              reg = json.load(f)

          errors = []
          skipped = []
          ok_count = 0

          for mid, m in reg["models"].items():
              if m.get("api_only"):
                  continue
              hf = m.get("hf")
              if not hf:
                  continue
              req = urllib.request.Request(hf, method="HEAD")
              req.add_header("User-Agent", "urai-ci/v2")
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      status = r.status
                      if status in (200, 302):
                          print(f"  ✓ {mid}: {status}")
                          ok_count += 1
                      else:
                          errors.append(f"{mid}: unexpected status {status}")
              except urllib.error.HTTPError as e:
                  if e.code == 401:
                      errors.append(f"{mid}: 401 GATED — check HF URL")
                  elif e.code == 302:
                      print(f"  ✓ {mid}: redirect (ok for HF)")
                      ok_count += 1
                  else:
                      errors.append(f"{mid}: HTTP {e.code} — {hf}")
              except Exception as e:
                  skipped.append(f"{mid}: {type(e).__name__} — {e}")

          if skipped:
              print(f"\n  Skipped (network/timeout): {len(skipped)}")
              for s in skipped:
                  print(f"    - {s}")

          if errors:
              print(f"\n::warning::URL checks failed ({len(errors)}) — HF network flaky in CI:")
              for e in errors:
                  print(f"  ⚠ {e}")
              # non-fatal: HF CDN is unreliable in GitHub Actions
          else:
              print(f"\n✓ All {ok_count} HF URLs reachable (no 401s)")
          PYEOF
