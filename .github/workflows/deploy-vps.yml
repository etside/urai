# Urai VPS Deploy — push to main triggers a pull + restart on the AWS EC2 VPS.
# Uses existing infrastructure: AWS EC2 (52.66.18.45), no new provisioning.
#
# Required GitHub repo secrets:
#   VPS_SSH_KEY        — SSH private key for ubuntu@52.66.18.45
#   OPENROUTER_API_KEY  — Muse Spark Open teacher key
#
# Optional secrets (already in .env on VPS, not overwritten if absent):
#   URAI_MASTER_KEY, GROQ_API_KEY, VERCEL_AI_GATEWAY_API_KEY, PORTKEY_API_KEY
name: Deploy to VPS

on:
  push:
    branches: [main, master, fresh-main]
  workflow_dispatch:

jobs:
  deploy:
    name: Pull + restart on AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only deploy after CI passes on the same commit
    needs: []
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 52.66.18.45
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/urai

            # Pull latest from the pushed branch
            BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo main)
            sudo git fetch --depth 1 origin "$BRANCH"
            sudo git checkout -f "$BRANCH"
            sudo git reset --hard origin/"$BRANCH"

            # Ensure .env has the cloud keys (non-destructive — only set if absent)
            touch /opt/urai/.env
            grep -q OPENROUTER_API_KEY /opt/urai/.env 2>/dev/null || \
              echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" | sudo tee -a /opt/urai/.env > /dev/null
            grep -q URAI_CLOUD_1M /opt/urai/.env 2>/dev/null || \
              echo "URAI_CLOUD_1M=1" | sudo tee -a /opt/urai/.env > /dev/null
            grep -q URAI_CLOUD_CONSULT /opt/urai/.env 2>/dev/null || \
              echo "URAI_CLOUD_CONSULT=1" | sudo tee -a /opt/urai/.env > /dev/null

            # Restart the API service
            sudo systemctl daemon-reload
            sudo systemctl restart urai-api

            # Health check
            sleep 3
            HEALTH=$(curl -s --max-time 5 http://127.0.0.1:8777/health || echo "FAIL")
            echo "Health: $HEALTH"

            # Show running version
            VERSION=$(python3 -c "import json; print(json.load(open('/opt/urai/pyproject.toml'.replace('.toml','')) and open('/opt/urai/pyproject.toml')))" 2>/dev/null || echo "unknown")
            echo "Deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $(git rev-parse --short HEAD)"
