# Urai VPS Deploy — push to main triggers rsync + restart on the AWS EC2 VPS.
# Uses rsync because the VPS cannot authenticate to a private GitHub repo.
#
# Required GitHub repo secrets:
#   VPS_SSH_KEY         — SSH private key for ubuntu@52.66.18.45
#   OPENROUTER_API_KEY   — Muse Spark Open teacher key
#   URAI_MASTER_KEY      — API master key (default: 856777)
#   VERCEL_AI_GATEWAY_API_KEY — Vercel AI Gateway key (optional)
name: Deploy to VPS

on:
  push:
    branches: [main, master, fresh-main]
  workflow_dispatch:

jobs:
  deploy:
    name: Rsync + restart on AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 52.66.18.45 >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync code to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='third_party/' \
            --exclude='model/base/*.gguf' \
            --exclude='model/generate/*.safetensors' \
            --exclude='data/sessions/' \
            --exclude='data/sched_runs/' \
            --exclude='.env' \
            --exclude='data/memory/' \
            --exclude='out/' \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new" \
            ./ ubuntu@52.66.18.45:/tmp/urai-deploy/

      - name: Install + restart on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 52.66.18.45
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            # Back up existing .env
            sudo cp /opt/urai/.env /tmp/urai-env-backup 2>/dev/null || true

            # Sync new code (preserve model weights and data)
            sudo rsync -a --delete \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='third_party/' \
              --exclude='model/base/*.gguf' \
              --exclude='model/generate/*.safetensors' \
              --exclude='data/sessions/' \
              --exclude='data/sched_runs/' \
              --exclude='.env' \
              --exclude='data/memory/' \
              --exclude='out/' \
              /tmp/urai-deploy/ /opt/urai/

            # Restore .env
            sudo cp /tmp/urai-env-backup /opt/urai/.env 2>/dev/null || true
            sudo chmod 600 /opt/urai/.env

            # Restart API
            sudo chown -R ubuntu:ubuntu /opt/urai 2>/dev/null || true
            sudo systemctl restart urai-api
            sleep 4

            # Health check
            HEALTH=$(curl -s --max-time 5 http://127.0.0.1:8777/health || echo "FAIL")
            echo "Health: $HEALTH"
            echo "Deployed: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: $(cat /tmp/urai-deploy/pyproject.toml | head -1)"
