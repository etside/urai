# Urai Android APK — WebView shell, built on GitHub Actions.
name: Urai Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Publish APK to urai-deps release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls app/build/outputs/apk/debug/*.apk
          gh release view urai-deps --repo etside/urai >/dev/null 2>&1 || gh release create urai-deps --repo etside/urai --title "Urai vendored deps" --notes "Binaries + adapters + APK." --prerelease
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/urai-app-debug.apk
          gh release upload urai-deps /tmp/urai-app-debug.apk --repo etside/urai --clobber
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
