# Urai Android APK — WebView shell, built on GitHub Actions.
#
# Produces a signed release APK when the URAI_KEYSTORE_* secrets are present,
# otherwise falls back to a debug APK so the workflow still works with no
# signing setup. Artifacts are published to the urai-deps release and, on
# version tags, to that tag's Release.
name: Urai Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Decode release keystore (if provided)
        env:
          URAI_KEYSTORE_BASE64: ${{ secrets.URAI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$URAI_KEYSTORE_BASE64" ]; then
            printf '%s' "$URAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/urai-release.jks"
            echo "URAI_KEYSTORE_FILE=$RUNNER_TEMP/urai-release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Resolve version name/code
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "URAI_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "URAI_VERSION_NAME=1.0.0-dev" >> "$GITHUB_ENV"
          fi
          echo "URAI_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK + AAB (release if signed, else debug)
        env:
          URAI_KEYSTORE_PASSWORD: ${{ secrets.URAI_KEYSTORE_PASSWORD }}
          URAI_KEY_ALIAS: ${{ secrets.URAI_KEY_ALIAS }}
          URAI_KEY_PASSWORD: ${{ secrets.URAI_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "true" ] && [ -n "$URAI_KEYSTORE_FILE" ] && [ -f "$URAI_KEYSTORE_FILE" ]; then
            gradle :app:assembleRelease :app:bundleRelease --no-daemon
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "AAB_PATH=app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
          else
            gradle :app:assembleDebug :app:bundleDebug --no-daemon
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "AAB_PATH=app/build/outputs/bundle/debug/app-debug.aab" >> "$GITHUB_ENV"
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-android
          if-no-files-found: warn
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab

      - name: Publish APK + AAB to urai-deps release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls "$APK_PATH" "$AAB_PATH"
          gh release view urai-deps --repo etside/urai >/dev/null 2>&1 || gh release create urai-deps --repo etside/urai --title "Urai vendored deps" --notes "Binaries + adapters + APK/AAB." --prerelease
          cp "$APK_PATH" /tmp/urai-app.apk
          cp "$AAB_PATH" /tmp/urai-app.aab
          gh release upload urai-deps /tmp/urai-app.apk /tmp/urai-app.aab --repo etside/urai --clobber
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/debug/*.aab
