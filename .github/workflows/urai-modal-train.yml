name: Urai Modal Train (unified student, T4)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Dataset tag (unified = merge all verified rows)"
        required: false
        default: "unified"
      max_steps:
        description: "Max training steps"
        required: false
        default: "300"
      gpu:
        description: "Modal GPU: T4 | A100 | L40S"
        required: false
        default: "T4"
permissions:
  contents: write
jobs:
  modal-train:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train on Modal (default GPU path)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URAI_TRAIN_TAG: ${{ inputs.tag }}
          MAX_TRAIN_STEPS: ${{ inputs.max_steps }}
          URAI_MODAL_GPU: ${{ inputs.gpu }}
        run: bash scripts/train/modal_train.sh
