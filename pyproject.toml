[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "urai"
version = "3.0.0"
description = "Urai — production AI runtime (local + cloud, CLI + API)"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tynio LTD"}]
readme = "README.md"

# Core — stdlib only, zero required deps
dependencies = []

[project.optional-dependencies]
# Local inference
local = [
    "faster-whisper>=1.0.3",
    "kokoro-onnx>=0.4.0",
]
# Browser automation
browser = [
    "playwright>=1.44.0",
]
# Vision & image
vision = [
    "Pillow>=10.0.0",
    "mss>=9.0.1",
]
# Charts
chart = [
    "matplotlib>=3.9.0",
]
# Vector memory
memory = [
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
]
# AWS integration
aws = [
    "boto3>=1.34.0",
]
# Web server (production)
server = [
    "uvicorn[standard]>=0.30.0",
    "httptools>=0.6.0",
]
# Training
train = [
    "unsloth>=2024.10",
    "trl>=0.12.0",
    "peft>=0.13.0",
    "datasets>=2.20.0",
    "transformers>=4.45.0",
]
# Full install
all = [
    "urai[local,browser,vision,chart,memory,aws,server]",
]
# Dev tools
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
urai = "jev.cli:main"
jev  = "jev.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jev*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
